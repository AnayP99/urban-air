[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "urbanair"
version = "0.2.0"
description = "AQI-based outdoor timing advisor for Indian cities"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.118.0",
    "uvicorn[standard]==0.37.0",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "pydantic==2.11.1",
    "pydantic-settings==2.10.1",
    "tzdata==2025.2",
    "pyyaml==6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.24.0",
    "mypy==1.13.0",
    "ruff==0.8.6",
    "types-pyyaml==6.0.12.20240917",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
