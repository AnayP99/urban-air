<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page_title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #faf6ee; --text: #16352c; --muted: #5f776e; --accent: #1a6e4f; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0d1a12; --text: #dff0e6; --muted: #7da893; --accent: #3dbf7a; } }
    * { box-sizing: border-box; margin: 0; }
    body { font-family: Manrope, sans-serif; background: var(--bg); color: var(--text); display: grid; place-items: center; min-height: 100vh; padding: 24px; text-align: center; }
    .error-code { font-size: clamp(5rem, 20vw, 10rem); font-weight: 800; line-height: 1; color: var(--accent); opacity: 0.25; }
    h1 { font-size: clamp(1.5rem, 4vw, 2.5rem); margin: 12px 0 16px; }
    p { color: var(--muted); max-width: 44ch; margin: 0 auto 24px; line-height: 1.65; }
    a { display: inline-flex; align-items: center; padding: 12px 24px; border-radius: 999px; background: var(--accent); color: #f8f4ec; font-weight: 800; text-decoration: none; }
  </style>
</head>
<body>
  <div>
    <p class="error-code">500</p>
    <h1>Something went wrong</h1>
    <p>An unexpected error occurred on our end. It has been logged and we will look into it. Please try again in a moment.</p>
    <a href="/">Go to home page</a>
  </div>
</body>
</html>
